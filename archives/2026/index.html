    var accent = 'green';
    if (match) {
      try { accent = decodeURIComponent(match[1]); } catch (e) {}

    if (!accents[accent]) accent = 'green';

      setTimeout(function () {
        if (!window.flatpaperRevealReady) {

        }
      }, 2000);
